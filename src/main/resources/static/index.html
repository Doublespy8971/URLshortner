<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftURL - Minimalist Link Shortener</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --error-color: #ef4444;
            --success-color: #22c55e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
        }

        .main-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result-section, #analytics-section {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .result-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        #short-url-input {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .copy-btn {
            width: auto;
            padding: 0 1.5rem;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .stat-card {
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .loading-spinner {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid #000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .grid, .analytics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SwiftURL</h1>
        <p>Shorten your long links in seconds.</p>
    </header>

    <div class="main-card">
        <div id="error-box" class="error-msg"></div>

        <div class="form-group">
            <label for="long-url">Destination URL</label>
            <input type="url" id="long-url" placeholder="https://very-long-url.com/something-really-deep" required>
        </div>

        <div class="grid">
            <div class="form-group">
                <label for="custom-code">Custom Code (Optional)</label>
                <input type="text" id="custom-code" placeholder="e.g. my-link">
            </div>
            <div class="form-group">
                <label for="expiry">Expires In</label>
                <select id="expiry">
                    <option value="">Never</option>
                    <option value="1">1 Day</option>
                    <option value="7">7 Days</option>
                    <option value="30">30 Days</option>
                </select>
            </div>
        </div>

        <button id="shorten-btn" onclick="shortenUrl()">
            <span id="btn-text">Shorten URL</span>
            <div id="btn-spinner" class="loading-spinner"></div>
        </button>

        <div id="result-section">
            <label>Your short link</label>
            <div class="result-box">
                <input type="text" id="short-url-input" readonly>
                <button class="copy-btn" onclick="copyToClipboard()">Copy</button>
            </div>

            <button id="refresh-analytics" style="background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border-color); margin-top: 1rem;" onclick="loadAnalytics()">
                Refresh Analytics
            </button>

            <div id="analytics-section">
                <label>Real-time Insights</label>
                <div class="analytics-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Clicks</div>
                        <div id="stat-clicks" class="stat-value">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Created At</div>
                        <div id="stat-created" class="stat-value" style="font-size: 0.9rem;">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Daily Clicks</div>
                        <div id="stat-daily" class="stat-value">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Expires At</div>
                        <div id="stat-expiry" class="stat-value" style="font-size: 0.9rem;">Never</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentCode = null;

    async function shortenUrl() {
        const originalUrl = document.getElementById('long-url').value;
        const customCode = document.getElementById('custom-code').value;
        const expiresInDays = document.getElementById('expiry').value;

        const errorBox = document.getElementById('error-box');
        const btn = document.getElementById('shorten-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const resultSection = document.getElementById('result-section');

        if (!originalUrl) {
            showError("Please enter a destination URL");
            return;
        }

        // Reset state
        showError(null);
        setLoading(true);

        try {
            const response = await fetch('/api/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    originalUrl,
                    customCode: customCode || null,
                    expiresInDays: expiresInDays ? parseInt(expiresInDays) : null
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Failed to shorten URL");
            }

            // Success
            currentCode = data.shortCode;
            const shortUrlInput = document.getElementById('short-url-input');
            shortUrlInput.value = data.shortUrl;

            resultSection.style.display = 'block';
            shortUrlInput.select();

            // Clear inputs
            document.getElementById('long-url').value = '';
            document.getElementById('custom-code').value = '';

            loadAnalytics(); // Load initial analytics
        } catch (err) {
            showError(err.message);
        } finally {
            setLoading(false);
        }
    }

    async function loadAnalytics() {
        if (!currentCode) return;

        const analyticsSection = document.getElementById('analytics-section');

        try {
            const response = await fetch(`/api/analytics/${currentCode}`);
            const data = await response.json();

            if (response.ok) {
                document.getElementById('stat-clicks').textContent = data.totalClicks;
                document.getElementById('stat-daily').textContent = data.clicksToday;
                document.getElementById('stat-created').textContent = new Date(data.createdAt).toLocaleDateString();

                // We need to fetch URL info for expiry if not in analytics response
                // but let's assume we can get it from another endpoint or if we added it to AnalyticsResponse
                // For now, let's just use the current code context or default

                analyticsSection.style.display = 'block';
            }
        } catch (err) {
            console.error("Analytics fetch failed", err);
        }
    }

    function copyToClipboard() {
        const input = document.getElementById('short-url-input');
        input.select();
        document.execCommand('copy');

        const copyBtn = document.querySelector('.copy-btn');
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        copyBtn.style.background = 'var(--success-color)';

        setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.style.background = 'var(--accent-color)';
        }, 2000);
    }

    function showError(msg) {
        const box = document.getElementById('error-box');
        if (msg) {
            box.textContent = msg;
            box.style.display = 'block';
        } else {
            box.style.display = 'none';
        }
    }

    function setLoading(isLoading) {
        const btn = document.getElementById('shorten-btn');
        const text = document.getElementById('btn-text');
        const spinner = document.getElementById('btn-spinner');

        if (isLoading) {
            btn.disabled = true;
            text.style.display = 'none';
            spinner.style.display = 'block';
        } else {
            btn.disabled = false;
            text.style.display = 'block';
            spinner.style.display = 'none';
        }
    }
</script>

</body>
</html>
